   name: Build Windows VST3
   on: [push, workflow_dispatch]
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - run: cmake -B build -A x64
         - run: cmake --build build --config Release --target YokokoOnonoPitchDelay_VST3
         - uses: actions/upload-artifact@v4
           with:
             name: YokokoOnono-VST3
             path: build/YokokoOnonoPitchDelay_artefacts/Release/VST3/
